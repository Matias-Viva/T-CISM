[project]
name = "goes-compress"
version = "0.1.0"
description = "Compresión de imágenes multiespectrales del satélite GOES-East (proyecto final de Ingeniería)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matias Viva" }]

dependencies = [
    "numpy>=2.0",
    "goes2go>=2025.10.0",
    "h5py>=3.16.0",
    "pillow>=12.3.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.uv]
package = false  # sin paquete por ahora; al agregar código en src/, quitar esta línea y definir build-system
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors (incl. line length)
    "W",     # pycodestyle warnings
    "F",     # pyflakes: unused imports & variables
    "I",     # isort: import ordering
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "D",     # pydocstyle: require docstrings
    "ANN",   # flake8-annotations: typed signatures & return types
    "N",     # pep8-naming
    "C90",   # mccabe: cyclomatic complexity
    "PTH",   # use pathlib instead of os.path
    "NPY",   # numpy-specific deprecations
    "PERF",  # perflint
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit: security
    "T20",   # no print() (use logging / click.echo)
    "ERA",   # no commented-out code
    "PL",    # pylint subset
    "TRY",   # tryceratops: exception handling
    "ARG",   # unused arguments
    "DTZ",   # naive datetimes (relevant for satellite timestamps)
    "PT",    # pytest style
]
ignore = [
    "ANN401",  # allow explicit typing.Any where genuinely needed
    "TRY003",  # long messages in exceptions are fine
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
# Require a return type even on functions that return None.
suppress-none-returning = false

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Tests: typed signatures stay required, but no docstrings on every case; allow assert and magic numbers.
"tests/**" = ["D100", "D103", "S101", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
